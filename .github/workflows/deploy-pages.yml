name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # First-time setup: Settings > Pages > Source > GitHub Actions.
      # enablement: true requires an additional privileged token; the default
      # GITHUB_TOKEN cannot enable a previously unconfigured Pages site.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Validate site
        run: node scripts/check.mjs
      - name: Prepare static files
        run: node scripts/build.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
